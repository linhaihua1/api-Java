[env]
env = test
base_url =
system = default

[run]
data_source = yaml
sheet_name = test_case_list
write_back = true
timeout = 10
verify = false
smoke = false
tags = smoke

[db]
host =
user =
password =
database =
port = 3306
charset = utf8
web =
environment =

[report]
report_type = allure
title = 接口自动化测试
project = amsapi-auto
html_name = report.html
max_attach_len = 20000

[log]
level = DEBUG
console_level = DEBUG
file_name_format = %Y_%m_%d
format = %(asctime)s | %(levelname)-7s | %(filename)s:%(lineno)d | %(message)s
date_format = %Y-%m-%d %H:%M:%S
root_name = amsapi

[auth]
refresh_ahead = 60
token_timeout = 10
token_verify = false

[ci]
detect_env_vars = JENKINS_URL,JENKINS_HOME,GITLAB_CI,BUILD_NUMBER,GITHUB_ACTIONS,TF_BUILD,CI
