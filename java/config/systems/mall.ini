[system]
name = 商城 / 购物
description = JWT 认证 + 网关多域名 + success 风格响应

[env]
base_url = http://gateway.mall.com
timeout = 10
verify = false
encoding =
content_type = application/json
response_format = auto

[hosts]
gateway = http://gateway.mall.com
user = http://user-service.mall.com
order = http://order-service.mall.com
goods = http://goods-service.mall.com

[headers]
Content-Type = application/json
X-Client = amsapi-auto

[response]
style = success
http_ok = 200,201,204

[auth]
type = bearer
token = ${token}
header = Authorization
prefix = Bearer

[hooks]
before_request =
after_response =
